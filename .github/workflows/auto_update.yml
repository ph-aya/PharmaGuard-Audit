name: Linux Hammer Update

on:
  schedule:
    - cron: '0 * * * *' # كل ساعة
  workflow_dispatch: # تشغيل يدوي

jobs:
  download-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Force Download (Wget)
        run: |
          # محاولة سحب الملف بتمويه المتصفح
          wget --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
               --header="Accept: text/csv,application/csv" \
               -O banned.csv \
               "https://data.europa.eu/api/hub/store/data/cosing-annex-ii-v2.csv"
          
          # التحقق: اذا الملف فارغ احذفه وافشل
          if [ ! -s banned.csv ]; then
            echo "File is empty!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@audit.com"
          git add banned.csv
          # اذا اكو تغيير، سوي Push. اذا ماكو، اسكت.
          git diff --quiet && git diff --staged --quiet || (git commit -m "📦 CSV Update" && git push)
