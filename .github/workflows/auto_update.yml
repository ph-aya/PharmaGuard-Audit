name: 30-Min Compliance Sync

on:
  schedule:
    - cron: '*/30 * * * *'  # السر: يشتغل كل 30 دقيقة
  workflow_dispatch:        # زر يسمح لك بتشغيله يدوياً للتجربة

jobs:
  update-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # صلاحية الكتابة لتحديث الملف
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Libraries
        run: |
          pip install pandas requests lxml html5lib BeautifulSoup4

      - name: Run Spy Script
        run: python update_data.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "PharmaGuard Bot"
          git config --global user.email "bot@pharmaguard.ai"
          git add banned.csv
          # نتحقق اذا اكو تحديث حقيقي لو لا
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ Auto-sync: EU Database Updated" && git push)
